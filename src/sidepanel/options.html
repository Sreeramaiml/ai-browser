<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Pagewise settings</title>
    <link rel="stylesheet" href="styles.css" />
    <script type="module" src="options.js"></script>
  </head>
  <body class="options-page">
    <div class="app">
      <header class="context">
        <img class="favicon" src="../../assets/icons/32.png" alt="" />
        <div class="page"><span class="page-title">Pagewise settings</span></div>
      </header>
      <div id="conn-banner" class="banner" role="alert" hidden>
        <p id="conn-banner-text"></p>
        <div class="banner-actions">
          <button type="button" id="conn-retry">Try again</button>
        </div>
      </div>
      <main id="settings-root" aria-label="Settings"></main>
    </div>
  </body>
</html>
